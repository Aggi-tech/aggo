name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests (no Docker required)
        run: mvn test -Dtest='!IntegrationTest' --no-transfer-progress

      - name: Run integration tests (requires Docker)
        run: mvn test -Dtest='IntegrationTest' --no-transfer-progress
