name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'           # trigger on version tags: v0.3.0, v1.0.0, etc.
  workflow_dispatch:   # allow manual trigger from the Actions UI
    inputs:
      release_version:
        description: 'Version to publish to GitHub Packages, for example 0.3.1'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GitHub Packages

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Point Maven's server id at the GitHub Packages repository
          server-id: github-aggi-tech
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            echo "Use a Maven-compatible release such as 0.3.1 or 1.0.0-rc.1." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set Maven project version
        run: >
          mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion=${{ steps.release.outputs.version }}
          -DgenerateBackupPoms=false
          --no-transfer-progress

      - name: Run tests before publishing
        run: mvn -B test -Dtest='!IntegrationTest' --no-transfer-progress

      - name: Publish to GitHub Packages
        run: mvn -B deploy --no-transfer-progress -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
