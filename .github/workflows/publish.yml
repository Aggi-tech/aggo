name: Publish to GitHub Packages

on:
  push:
    branches:
      - master
  workflow_dispatch:   # allow manual trigger from the Actions UI
    inputs:
      release_version:
        description: 'Version to publish to GitHub Packages, for example 0.3.1'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write   # required to push to GitHub Packages

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Point Maven's server id at the GitHub Packages repository
          server-id: github-aggi-tech
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          LATEST_TAG="$(
            git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n 1 || true
          )"

          if [[ -z "$LATEST_TAG" ]]; then
            BASE_VERSION="0.0.0"
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
          else
            BASE_VERSION="${LATEST_TAG#v}"
            RANGE="${LATEST_TAG}..HEAD"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_version }}" ]]; then
            VERSION="${{ inputs.release_version }}"
          else
            BUMP="patch"
            if git log --format=%s "$RANGE" | grep -Eq '(^feat|BREAKING CHANGE|!: )'; then
              BUMP="minor"
            fi
            if git log --format=%s "$RANGE" | grep -Eq 'BREAKING CHANGE|!: '; then
              BUMP="major"
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
              *)
                echo "Invalid SemVer bump: $BUMP" >&2
                exit 1
                ;;
            esac

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            echo "Use a Maven-compatible SemVer release such as 0.3.1 or 1.0.0-rc.1." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Maven version: $VERSION"

      - name: Set Maven project version
        run: >
          mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion=${{ steps.release.outputs.version }}
          -DgenerateBackupPoms=false
          --no-transfer-progress

      - name: Run tests before publishing
        run: mvn -B test -Dtest='!IntegrationTest' --no-transfer-progress

      - name: Publish to GitHub Packages
        run: mvn -B deploy --no-transfer-progress -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag SemVer release
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'master'
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
